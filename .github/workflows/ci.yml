name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-analyze:
    name: Build, Test & SonarQube Analysis
    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache dotnet-sonarscanner tool
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-sonar-scanner-net10

      - name: Install SonarQube scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore HotelBooking.sln

      - name: Generate SonarQube token
        id: sonar-token
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-$GITHUB_RUN_ID" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Begin SonarQube analysis
        run: >
          dotnet sonarscanner begin
          /k:"HotelBooking"
          /d:sonar.token="${{ steps.sonar-token.outputs.token }}"
          /d:sonar.host.url="http://localhost:9000"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="**/*.trx"

      - name: Build
        run: dotnet build HotelBooking.sln --configuration Release --no-restore

      - name: Run unit tests with coverage
        run: >
          dotnet test HotelBooking.UnitTests/HotelBooking.UnitTests.csproj
          --configuration Release
          --no-build
          --logger "trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Run integration tests
        run: >
          dotnet test HotelBooking.IntegrationTests/HotelBooking.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx"
          --results-directory ./TestResults

      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ steps.sonar-token.outputs.token }}"
